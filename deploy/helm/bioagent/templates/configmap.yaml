apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bioagent.fullname" . }}-config
  labels: {{- include "bioagent.labels" . | nindent 4 }}
data:
  REDIS_URL: {{ include "bioagent.redisUrl" . | quote }}
  WORKER_PIPELINE: {{ .Values.worker.pipeline | quote }}
  REPLAY_SECONDS: {{ .Values.worker.replaySeconds | quote }}
  WORKER_CONCURRENCY: {{ .Values.worker.concurrency | quote }}
  WORKER_METRICS_PORT: {{ .Values.worker.metricsPort | quote }}
  {{- if .Values.jaeger.enabled }}
  OTLP_ENDPOINT: {{ printf "http://%s-jaeger:4318" (include "bioagent.fullname" .) | quote }}
  {{- end }}
  {{- if .Values.neo4j.uri }}
  NEO4J_URI: {{ .Values.neo4j.uri | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
