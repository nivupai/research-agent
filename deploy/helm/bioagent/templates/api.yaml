apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bioagent.fullname" . }}-api
  labels: {{- include "bioagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "bioagent.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "bioagent.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "bioagent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bioagent", "serve", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          ports:
            - {name: http, containerPort: {{ .Values.api.port }}}
          {{- include "bioagent.env" . | nindent 10 }}
          {{- include "bioagent.volumeMounts" . | nindent 10 }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- include "bioagent.volumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bioagent.fullname" . }}-api
  labels: {{- include "bioagent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "bioagent.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http}
