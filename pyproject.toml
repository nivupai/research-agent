[project]
name = "bioagent"
version = "0.1.0"
description = "BioResearch Agent: literature, chemistry and sandbox MCP servers plus agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rdkit>=2026.9.2",
    "docker>=7.2.0",
]

[project.scripts]
bioagent-literature = "bioagent.mcp_servers.literature.__main__:main"
bioagent-chemistry = "bioagent.mcp_servers.chemistry.__main__:main"
bioagent-sandbox = "bioagent.mcp_servers.sandbox.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pre-commit>=3.7",
    "types-docker>=7.2.0.20261102",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioagent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bioagent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits real external APIs (deselect with -m 'not live')",
    "docker: needs a local Docker daemon and the sandbox image (make sandbox-image)",
]
addopts = "-m 'not live and not docker'"
