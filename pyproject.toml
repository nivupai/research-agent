[project]
name = "bioagent"
version = "0.1.0"
description = "BioResearch Agent: literature, chemistry and sandbox MCP servers plus agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rdkit>=2026.9.2",
    "docker>=7.2.0",
    "rank-bm25>=0.2.2",
    "chromadb>=1.5.9",
    "pyyaml>=6.0.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=1.1.0",
    "google-genai>=3.2.0",
    "neo4j>=6.4.1",
]

[project.scripts]
bioagent-literature = "bioagent.mcp_servers.literature.__main__:main"
bioagent-chemistry = "bioagent.mcp_servers.chemistry.__main__:main"
bioagent-sandbox = "bioagent.mcp_servers.sandbox.__main__:main"
bioagent-retrieval = "bioagent.mcp_servers.retrieval.__main__:main"
bioagent-graph = "bioagent.mcp_servers.graph.__main__:main"
bioagent = "bioagent.cli:main"

[project.optional-dependencies]
models = [
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pre-commit>=3.7",
    "types-docker>=7.2.0.20261102",
    "types-requests>=2.33.0.20261030",
    "types-pyyaml>=6.0.12.20261111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioagent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bioagent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*", "rank_bm25.*", "sentence_transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits real external APIs (deselect with -m 'not live')",
    "docker: needs a local Docker daemon and the sandbox image (make sandbox-image)",
    "models: loads real sentence-transformers models (needs the `models` extra)",
    "llm: calls a real LLM (Gemini API or local Ollama)",
    "neo4j: needs the local Neo4j from docker-compose.yml (make graph-up)",
]
addopts = "-m 'not live and not docker and not models and not llm and not neo4j'"
