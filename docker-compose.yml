# Local services for the BioResearch Agent. Start with `make graph-up`.
services:
  neo4j:
    image: neo4j:5.26.12-community
    container_name: bioagent-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # browser (localhost only)
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_db_transaction_timeout: 60s
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # --- serving stack: docker compose --profile serve up -d --build (make serve-up) ---------
  redis:
    profiles: ["serve"]
    image: redis:7.4-alpine
    container_name: bioagent-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  jaeger:
    profiles: ["serve"]
    image: jaegertracing/all-in-one:1.62.0
    container_name: bioagent-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # UI
      - "127.0.0.1:4318:4318"     # OTLP/HTTP
    restart: unless-stopped

  api:
    profiles: ["serve"]
    build: .
    image: bioagent:latest
    container_name: bioagent-api
    command: ["uv", "run", "--no-sync", "bioagent", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      OTLP_ENDPOINT: http://jaeger:4318
      CORPUS_DB: /app/data/corpus/corpus.sqlite
    volumes:
      - ./data:/app/data
      - hf-cache:/app/.hf_cache
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    profiles: ["serve"]
    image: bioagent:latest
    container_name: bioagent-worker
    command: ["uv", "run", "--no-sync", "bioagent", "worker"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      OTLP_ENDPOINT: http://jaeger:4318
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./models:/app/models:ro
      - hf-cache:/app/.hf_cache
    ports:
      - "127.0.0.1:9101:9101"     # worker Prometheus metrics
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  hf-cache:
